<footer class="site-footer" id="contact">
  <div class="container">
    <div class="footer-grid">
      <div>
        <h3>Plan du site</h3>
        <ul>
          {% for l in sitemap %}
          <li><a href="{{ l.href }}">{{ l.label }}</a></li>
          {% endfor %}
        </ul>
      </div>

      <div>
        <h3>Contact</h3>
        <p>
          <a href="mailto:highdungeonproduction@gmail.com"
            >highdungeonproduction<br />@gmail.com</a
          >
        </p>
      </div>

      <form
        class="contact-form"
        action="{{ url_for('contact') }}"
        method="post"
      >
        <input type="text" name="nom" placeholder="Nom" aria-label="Nom" />
        <input
          type="text"
          name="prenom"
          placeholder="Prénom"
          aria-label="Prénom"
        />
        <input
          class="full"
          type="email"
          name="email"
          placeholder="Adresse mail"
          aria-label="Adresse mail"
          required
        />
        <textarea
          class="full"
          name="message"
          placeholder="Écrivez votre message..."
          aria-label="Message"
          required
        ></textarea>
        <button type="submit" class="btn btn--gold">Envoyer</button>
      </form>
    </div>

    <div class="footer-social">
      <a href="#" aria-label="Facebook"
        ><i class="fa-brands fa-facebook-f"></i
      ></a>
      <a href="#" aria-label="Instagram"
        ><i class="fa-brands fa-instagram"></i
      ></a>
    </div>
    <p class="legal">Mentions légales - ©DungeonRadio2023</p>
  </div>
</footer>
